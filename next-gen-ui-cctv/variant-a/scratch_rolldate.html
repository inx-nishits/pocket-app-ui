<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Rolldate</title>
</head>
<body>
    <input type="text" id="date" readonly placeholder="Select Date">
    <input type="text" id="time" readonly placeholder="Select Time">

    <script src="https://cdn.jsdelivr.net/npm/rolldate@3.1.3/dist/rolldate.min.js"></script>
    <script>
        new Rolldate({
            el: '#date',
            format: 'YYYY-MM-DD',
            beginYear: 2000,
            endYear: 2100
        });
        new Rolldate({
            el: '#time',
            format: 'hh:mm:ss'
        });
    </script>
</body>
</html>
